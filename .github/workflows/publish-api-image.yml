name: Publish PulseFlow.Api image

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore PulseFlow.slnx

      - name: Build
        run: dotnet build PulseFlow.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test PulseFlow.slnx --no-build

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Check project documentation
        shell: pwsh
        run: ./scripts/check-project-docs.ps1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulseflow-api
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=raw,value=develop

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PulseFlow.Api/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
