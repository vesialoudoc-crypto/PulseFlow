# Settings shared by both API containers. The YAML anchor keeps their configuration in one place.
# `<<: *api-defaults` below copies these settings into each API service. This avoids
# accidentally configuring api-1 and api-2 differently while they are replicas.
x-api-defaults: &api-defaults
  build:
    context: ../..
    dockerfile: src/PulseFlow.Api/Dockerfile
    target: final
  environment:
    ASPNETCORE_URLS: "http://+:8080"

    ConnectionStrings__PulseFlow: Host=postgres;Port=5432;Database=pulseflow;Username=pulseflow;Password=pulseflow-local-password
    ConnectionStrings__RabbitMq: amqp://pulseflow:pulseflow-local-password@rabbitmq:5672/
    ConnectionStrings__Redis: redis:6379,abortConnect=false

    RabbitMq__QueueName: pulseflow.ingestion-batches
    # Each API container also runs one parser worker. Two API containers therefore
    # create two workers in total, without increasing the per-container setting.
    RabbitMq__ConsumerCount: 1
    RabbitMq__PublisherChannelCount: 4

    Ingestion__ChunkCapacity: 100

    IngestionRateLimit__RequestLimit: 10000000
    IngestionRateLimit__WindowDuration: "00:01:00"
  depends_on:
    # The API waits for its shared dependencies. Migrations must finish first so the
    # database schema exists before either API container accepts requests.
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrations:
      condition: service_completed_successfully

services:
  # Service names are also host names inside the Compose network. For example, the
  # API connects to PostgreSQL using the name `postgres`, not localhost.
  postgres:
    # PostgreSQL is the durable event store. Its named volume keeps local data when
    # containers are recreated.
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: pulseflow
      POSTGRES_USER: pulseflow
      POSTGRES_PASSWORD: pulseflow-local-password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Other services wait until PostgreSQL can accept connections.
      test: ["CMD", "pg_isready", "-U", "pulseflow", "-d", "pulseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # RabbitMQ transfers accepted batches from the API to parser workers.
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pulseflow
      RABBITMQ_DEFAULT_PASS: pulseflow-local-password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # This existing host port is kept for local RabbitMQ access.
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    # Redis holds the shared rate-limit state, so both API containers use one quota.
    image: redis:8.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    # This short-lived container updates the database schema, then exits successfully.
    # The API containers wait for that successful exit before starting.
    build:
      context: ../..
      dockerfile: src/PulseFlow.Api/Dockerfile
      target: migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command:
      - dotnet
      - ef
      - database
      - update
      - --connection
      - Host=postgres;Port=5432;Database=pulseflow;Username=pulseflow;Password=pulseflow-local-password

  api-1:
    <<: *api-defaults
    # Temporary direct access for testing the first API container before HAProxy is added.
    ports:
      # Left side is the port on this computer; right side is the port inside the container.
      - "5254:8080"

  api-2:
    <<: *api-defaults
    # Temporary direct access for testing the second API container before HAProxy is added.
    ports:
      # A different host port makes it possible to reach this container separately.
      - "5255:8080"

volumes:
  # Named volumes are managed by Docker and preserve local state between container recreations.
  postgres_data:
  rabbitmq_data:
  redis_data:
