services:
  haproxy:
    # HAProxy is the only local ingress for the two API replicas.
    image: haproxy:3.2.9-alpine
    # Startup ordering only; HAProxy's own health checks decide whether a replica
    # receives traffic after it has started.
    depends_on:
      - api-1
      - api-2
    ports:
      # API containers intentionally have no direct host ports, so local clients
      # exercise load balancing and failover through the documented endpoint.
      - "${PULSEFLOW_INGRESS_PORT:-5254}:8080"
    volumes:
      # Keep the proxy policy versioned with the local stack and prevent the
      # container from modifying the source configuration.
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # These are equivalent API replicas. Their distinct service names are HAProxy
  # backend identities, making distribution and failover visible in proxy logs.
  api-1:
    extends:
      file: ./compose.api.yaml
      service: api

  api-2:
    extends:
      file: ./compose.api.yaml
      service: api
