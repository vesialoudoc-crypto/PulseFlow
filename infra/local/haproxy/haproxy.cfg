global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend ingress
    bind *:8080
    default_backend api_backends

backend api_backends
    balance roundrobin
    option httpchk GET /health/live
    http-check expect status 200
    server api-1 api-1:8080 check
    server api-2 api-2:8080 check
