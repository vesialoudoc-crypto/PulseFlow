services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PULSEFLOW_POSTGRES_DB:?PULSEFLOW_POSTGRES_DB must be set}
      POSTGRES_USER: ${PULSEFLOW_POSTGRES_USER:?PULSEFLOW_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${PULSEFLOW_POSTGRES_PASSWORD:?PULSEFLOW_POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
