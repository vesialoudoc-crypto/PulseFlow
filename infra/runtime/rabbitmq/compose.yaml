services:
  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${PULSEFLOW_RABBITMQ_USER:?PULSEFLOW_RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${PULSEFLOW_RABBITMQ_PASSWORD:?PULSEFLOW_RABBITMQ_PASSWORD must be set}
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
